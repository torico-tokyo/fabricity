[flake8]
exclude = tests/support,tests/Python26SocketServer.py,sites,fabric/api.py

[tool:pytest]
testpaths = tests
# The suite swaps sys.stdout/sys.stderr itself (tests/mock_streams.py) and runs
# a real local SSH server, neither of which survives pytest's output capturing;
# the nose runner passed -s for the same reason.
addopts = --capture=no
